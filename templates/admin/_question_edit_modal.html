{# Modale de modification d'une question, partagée par toute page admin qui
   propose d'éditer une question (liste des questions, suggestions une fois
   approuvées, signalements). Un simple <button class="question-edit-button"
   data-edit-url="..."> suffit à l'ouvrir - voir admin_question_modal.js,
   qui cherche ce shell par id et n'agit que s'il le trouve. #}
<div id="question-edit-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="question-edit-title">
    <div class="question-edit-dialog max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-2xl border border-cyan-400/30 bg-slate-950 p-4 shadow-2xl sm:p-5">
        <div class="mb-3 flex items-center justify-between gap-4 border-b border-slate-800 pb-3">
            <div><p class="text-xs font-bold uppercase tracking-widest text-cyan-400">Administration</p><h2 id="question-edit-title" class="mt-0.5 text-lg font-extrabold text-slate-100">Modifier la question</h2></div>
            <button type="button" id="question-edit-close" class="rounded-lg px-3 py-2 text-slate-400 hover:bg-slate-800 hover:text-white" aria-label="Fermer">✕</button>
        </div>
        <div id="question-edit-content"><p class="py-12 text-center text-slate-400">Chargement…</p></div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/admin_question_modal.js') }}"></script>
