{% extends "base.html" %}

{% block content %}
<div class="max-w-sm mx-auto mt-12">
    <h2 class="text-xl mb-6">Se connecter</h2>

    {% if error %}
    <p class="text-red-400 mb-4 text-sm">{{ error }}</p>
    {% endif %}

    <form method="POST" class="flex flex-col gap-4">
        <div>
            <label class="block text-sm text-slate-400 mb-1">Email</label>
            <input type="email" name="email" required
                   class="w-full bg-slate-900 border border-cyan-400/50 rounded-lg px-3 py-2 text-slate-100">
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">Mot de passe</label>
            <input type="password" name="password" required
                   class="w-full bg-slate-900 border border-cyan-400/50 rounded-lg px-3 py-2 text-slate-100">
        </div>
        <button type="submit"
                class="bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold py-2 rounded-lg shadow-[0_0_15px_rgba(34,211,238,0.4)] transition mt-2">
            Se connecter
        </button>
    </form>
</div>
{% endblock %}
