{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto mt-8">
    <h2 class="text-xl mb-6 text-center">Classement général</h2>

    {% if results %}
    <div class="flex flex-col gap-2">
        {% for result in results %}
        <div class="flex items-center justify-between bg-slate-900 border border-cyan-400/30 rounded-lg px-4 py-3">
            <div class="flex items-center gap-3">
                <span class="text-cyan-400 font-bold w-6 text-right">{{ loop.index }}</span>
                <span>{{ result.username }}</span>
            </div>
            <span class="text-slate-400 text-sm">
                {{ result.correct }} / {{ result.total }} bonnes réponses
            </span>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="text-slate-500 text-center">Aucune partie jouée pour le moment.</p>
    {% endif %}
</div>
{% endblock %}
