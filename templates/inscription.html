{% extends "base.html" %}

{% block content %}
<div class="max-w-sm mx-auto mt-12">
    <h2 class="text-xl mb-6">Créer un compte</h2>

    {% if erreur %}
    <p class="text-red-400 mb-4 text-sm">{{ erreur }}</p>
    {% endif %}

    <form method="POST" class="flex flex-col gap-4">
        <div>
            <label class="block text-sm text-slate-400 mb-1">Nom d'utilisateur</label>
            <input type="text" name="username" required
                   class="w-full bg-slate-900 border border-cyan-400/50 rounded-lg px-3 py-2 text-slate-100">
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">Email</label>
            <input type="email" name="email" required
                   class="w-full bg-slate-900 border border-cyan-400/50 rounded-lg px-3 py-2 text-slate-100">
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">Mot de passe</label>
            <input type="password" name="password" required
                   class="w-full bg-slate-900 border border-cyan-400/50 rounded-lg px-3 py-2 text-slate-100">
            <p class="text-xs text-slate-500 mt-1">8 caractères min., 1 majuscule, 1 minuscule, 1 chiffre, 1 caractère spécial.</p>
        </div>
        <button type="submit"
                class="bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold py-2 rounded-lg shadow-[0_0_15px_rgba(34,211,238,0.4)] transition mt-2">
            S'inscrire
        </button>
    </form>
</div>
{% endblock %}
