{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto mt-8">
    <h2 class="text-xl mb-6 text-center">Choisis un mode de jeu</h2>

    <div class="flex flex-col gap-4">
        <a href="{{ url_for('quiz', mode='qcm', position=1) }}"
           class="bg-slate-900 hover:bg-slate-800 border border-blue-500/50 rounded-lg px-4 py-4 transition">
            <p class="font-bold text-blue-400">Quiz</p>
            <p class="text-sm text-slate-400">Questions à choix multiples</p>
        </a>

        <a href="{{ url_for('quiz', mode='vrai_faux', position=1) }}"
           class="bg-slate-900 hover:bg-slate-800 border border-blue-500/50 rounded-lg px-4 py-4 transition">
            <p class="font-bold text-blue-400">Vrai / Faux</p>
            <p class="text-sm text-slate-400">Affirmations sur le cinéma</p>
        </a>
    </div>
</div>
{% endblock %}
