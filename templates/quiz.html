{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto mt-8">
    <p class="text-sm text-cyan-400 mb-2">Question {{ question.id }}</p>
    <h2 class="text-xl mb-6">{{ question.prompt }}</h2>

    <div class="flex flex-col gap-3">
        {% if question.mode == "qcm" %}
            {% for option in question.payload.options %}
            <button type="button" data-reponse="{{ loop.index0 }}"
                    class="bouton-reponse bg-slate-900 hover:bg-slate-800 border border-cyan-400/30 text-left px-4 py-3 rounded-lg transition">
                {{ option }}
            </button>
            {% endfor %}
        {% elif question.mode == "vrai_faux" %}
            <button type="button" data-reponse="true"
                    class="bouton-reponse bg-slate-900 hover:bg-slate-800 border border-cyan-400/30 px-4 py-3 rounded-lg transition">
                Vrai
            </button>
            <button type="button" data-reponse="false"
                    class="bouton-reponse bg-slate-900 hover:bg-slate-800 border border-cyan-400/30 px-4 py-3 rounded-lg transition">
                Faux
            </button>
        {% endif %}
    </div>
</div>

<script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
{% endblock %}
