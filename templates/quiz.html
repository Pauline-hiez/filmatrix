{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto mt-8">
    <p class="text-sm text-cyan-400 mb-2">Question {{ question.id }}</p>
    <h2 class="text-xl mb-6">{{ question.prompt }}</h2>

    <form method="POST" class="flex flex-col gap-3">
        {% if question.mode == "qcm" %}
            {% for option in question.payload.options %}
            <button type="submit" name="reponse" value="{{ loop.index0 }}"
                    class="bg-slate-900 hover:bg-slate-800 border border-cyan-400/50 text-left px-4 py-3 rounded-lg transition">
                {{ option }}
            </button>
            {% endfor %}
        {% elif question.mode == "vrai_faux" %}
            <button type="submit" name="reponse" value="true"
                    class="bg-slate-900 hover:bg-slate-800 border border-cyan-400/50 px-4 py-3 rounded-lg transition">
                Vrai
            </button>
            <button type="submit" name="reponse" value="false"
                    class="bg-slate-900 hover:bg-slate-800 border border-cyan-400/50 px-4 py-3 rounded-lg transition">
                Faux
            </button>
        {% endif %}
    </form>
</div>
{% endblock %}
